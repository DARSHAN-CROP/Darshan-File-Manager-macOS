name: Attach release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.0

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.event.inputs.tag || 'v1.0' }}

jobs:
  attach:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make a .dmg from the app zip
        run: |
          mkdir dist && unzip -q release/DarshanFileManager-macOS.zip -d dist
          APP=$(find dist -maxdepth 2 -name '*.app' | head -1); echo "app: $APP"
          mkdir dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Darshan File Manager" -srcfolder dmgroot -ov -format UDZO DarshanFileManager-macOS.dmg
          ls -la DarshanFileManager-macOS.dmg
      - name: Upload .zip and .dmg to the release
        run: gh release upload "$TAG" release/DarshanFileManager-macOS.zip DarshanFileManager-macOS.dmg --clobber
